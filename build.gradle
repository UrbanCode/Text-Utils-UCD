plugins {
    id 'java'
    id 'groovy'
}

defaultTasks 'main'

def version = project.findProperty('version') ?: 'dev'
def pluginName  = 'Text-Utils-UCD'

def libDir = layout.projectDirectory.dir('lib')
def libBuildDir = layout.projectDirectory.dir('lib/build')
def libTestDir = layout.projectDirectory.dir('lib/test')

repositories {
    mavenCentral()
}

configurations {
    buildConf
    testConf
    compileClasspath.extendsFrom implementation
}

dependencies {
    implementation('com.ibm.urbancode.plugins:groovy-plugin-utils:+') {transitive = false}
    implementation('org.json:json:+') {transitive = false}

    buildConf 'org.codehaus.groovy:groovy-all:1.8.8'

    testConf 'junit:junit:4.13.1'
    testConf 'org.hamcrest:hamcrest-core:1.3'

    testImplementation 'junit:junit:4.13.1'
    testImplementation 'org.hamcrest:hamcrest-core:1.3'
}

sourceSets {
    main {
        java { srcDirs = ['src/main/java'] }
        groovy { srcDirs = ['src/main/groovy'] }
    }
    test {
        java { srcDirs = ['src/test/java'] }
        groovy { srcDirs = ['src/test/groovy'] }
    }
}

tasks.register('main') {
    dependsOn 'cleanBuild', 'resolve', 'compileClasses', 'buildPlugin', 'dist', 'runTests'
    doLast {
        println 'Plugin build complete!'
    }
}

tasks.register('cleanBuild') {
    delete layout.buildDirectory
    delete 'releases'
    delete 'lib'

    doLast {
        mkdir layout.buildDirectory.get().asFile
    }
}

tasks.register('resolve') {
    dependsOn 'cleanBuild'
    doFirst {
        mkdir libDir.asFile
        mkdir libBuildDir.asFile
        mkdir libTestDir.asFile
    }

    doLast {
        copy {
            from configurations.runtimeClasspath
            into libDir.asFile
        }

        copy {
            from configurations.buildConf
            into libBuildDir.asFile
        }

        copy {
            from configurations.testConf
            into libTestDir.asFile
        }
    }
}

tasks.register('compileClasses') {
    dependsOn 'resolve', 'compileGroovy', 'compileJava'

    doLast {
        mkdir("$projectDir/lib/build/classes")

        copy {
            from sourceSets.main.output.classesDirs
            into "$projectDir/lib/build/classes"
        }

        println 'Classes compiled successfully'
    }   
}

tasks.register('buildPlugin') {
    dependsOn 'resolve', 'compileClasses'

    doLast {
        def buildPluginDir = layout.buildDirectory.dir('plugin').get().asFile

        // plugin XML files + scripts
        copy {
            from('plugin') {
                include 'info.xml'
                include 'upgrade.xml'
                include 'plugin.xml'
            }
            from 'src/main/scripts'
            into buildPluginDir
        }

        // license
        copy {
            from('license') {
                include 'EPL.txt'
            }
            into "$buildPluginDir/license"
        }

        // documentation
        copy {
            from('doc') {
                include 'HowTo.html'
            }
            into "$buildPluginDir/doc"
        }

        // libraries (excluding build and test)
        copy {
            from('lib') {
                exclude '**/build/**'
                exclude '**/test/**'
            }
            into "$buildPluginDir/lib"
        }

        // groovy source files
        copy {
            from('src/main/groovy') {
                include '**/*.groovy'
            }
            into "$buildPluginDir/classes"
        }

        // compiled java classes
        copy {
            from('lib/build/classes') {
                include '**/*.class'
            }
            into "$buildPluginDir/classes"
        }
    }
}

tasks.register('dist', Zip) {
    description = 'Create distribution zip'
    dependsOn 'resolve', 'buildPlugin'
    archiveFileName = "${pluginName}-v${version}.zip"
    destinationDirectory = file('releases')
    from("$buildDir/plugin")
}

tasks.register('runTests') {
    description = 'Compile and run JUnit tests ()'
    dependsOn 'compileTests', 'test'
}

tasks.register('compileTests') {
    description = 'Compile test Java classes (equivalent to Ant compile-tests)'
    dependsOn 'compileClasses', 'compileTestJava'
}

test {
    useJUnit()

    reports {
        junitXml.required = true
        html.required = true

        junitXml.outputLocation = layout.projectDirectory.dir("releases/report/xml")
        html.outputLocation = layout.projectDirectory.dir("releases/report/html")
    }

    testLogging {
        events "passed", "failed", "skipped"
    }
}
