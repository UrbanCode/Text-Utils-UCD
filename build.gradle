plugins {
    id 'java'
}

version = project.findProperty('version') ?: 'dev'

def pluginName  = 'Text-Utils-UCD'

// ── Directory references (mirrors Ant properties) ─────────────────────────────
def libBuildClassesDir = layout.projectDirectory.dir('lib/build/classes')
def libTestJavaDir     = layout.projectDirectory.dir('lib/test/java')
def libBuildDir        = layout.projectDirectory.dir('lib/build')
def libTestDir         = layout.projectDirectory.dir('lib/test')

// ── Repositories & Configurations ─────────────────────────────────────────────
repositories {
    mavenCentral()
}

configurations {
    buildConf   // groovy-all + groovy-ant (build-time only)
    testConf    // junit + hamcrest
}

dependencies {
    // default conf – runtime (from ivy.xml)
    implementation 'com.ibm.urbancode.plugins:groovy-plugin-utils:1.0'
    implementation 'org.json:json:20160212'

    // build conf (from ivy.xml)
    buildConf 'org.codehaus.groovy:groovy-all:3.0.9'
    buildConf 'org.codehaus.groovy:groovy-ant:3.0.9'

    // test conf (from ivy.xml)
    testConf          'junit:junit:4.11'
    testConf          'org.hamcrest:hamcrest-core:1.3'
    testImplementation 'junit:junit:4.11'
    testImplementation 'org.hamcrest:hamcrest-core:1.3'
}

// ── Source sets ───────────────────────────────────────────────────────────────
sourceSets {
    main {
        java { srcDirs = ['src/main/java'] }
    }
    test {
        java { srcDirs = ['src/test/java'] }
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

// ── Compile configuration ─────────────────────────────────────────────────────
tasks.named('compileJava') {
    classpath += configurations.buildConf
    destinationDirectory.set(libBuildClassesDir)
}

tasks.named('compileTestJava') {
    classpath += files(libBuildClassesDir)
    classpath += configurations.testConf
    destinationDirectory.set(libTestJavaDir)
}

// ── resolve target ────────────────────────────────────────────────────────────
// Equivalent to: ivy:retrieve for default, build, and test configurations
tasks.register('resolve') {
    group       = 'build'
    description = 'Resolve and copy dependencies to lib dirs'
    doLast {
        mkdir libBuildDir.asFile
        mkdir libTestDir.asFile
        copy {
            from configurations.runtimeClasspath
            into layout.projectDirectory.dir('lib').asFile
        }
        copy {
            from configurations.buildConf
            into libBuildDir.asFile
        }
        copy {
            from configurations.testConf
            into libTestDir.asFile
        }
    }
}

// ── clean target ──────────────────────────────────────────────────────────────
tasks.register('cleanBuild') {
    group       = 'build'
    description = 'Delete build dir, dist zip, and compiled lib dirs'
    doLast {
        delete layout.buildDirectory.get().asFile
        mkdir  layout.buildDirectory.get().asFile
        delete layout.projectDirectory.file("releases/${pluginName}-v${version}.zip").asFile
        delete libTestJavaDir.asFile
        delete libBuildClassesDir.asFile
    }
}

// ── compile-classes target ────────────────────────────────────────────────────
tasks.named('compileJava') { dependsOn 'resolve' }

tasks.register('compileClasses') {
    group       = 'build'
    description = 'Compile Java classes (equivalent to Ant compile-classes)'
    dependsOn 'resolve', 'compileJava'
    doLast {
        println 'Classes compiled successfully'
    }
}

// ── compile-tests target ──────────────────────────────────────────────────────
tasks.register('compileTests') {
    group       = 'build'
    description = 'Compile test Java classes (equivalent to Ant compile-tests)'
    dependsOn 'compileClasses', 'compileTestJava'
}

// ── build target ──────────────────────────────────────────────────────────────
tasks.register('buildPlugin') {
    group       = 'build'
    description = 'Assemble plugin directory structure (equivalent to Ant build)'
    dependsOn 'resolve'
    doLast {
        def pluginOut = layout.buildDirectory.dir('plugin').get().asFile

        // plugin XML files + scripts
        copy {
            from('plugin') {
                include 'info.xml'
                include 'upgrade.xml'
                include 'plugin.xml'
            }
            from 'src/main/scripts'
            into pluginOut
        }

        // license/EPL.txt
        copy {
            from('license') { include 'EPL.txt' }
            into new File(pluginOut, 'license')
        }

        // doc/
        copy {
            from('doc') {
                include 'HowTo.html'
                include 'UCD Siebel Plugin DesignDocument.docx'
            }
            into new File(pluginOut, 'doc')
        }

        // lib/ (exclude build and test sub-dirs)
        copy {
            from('lib') {
                exclude '**/build/**'
                exclude '**/test/**'
            }
            into new File(pluginOut, 'lib')
        }

        // classes/ = groovy sources + compiled Java .class files
        copy {
            from('src/main/groovy') { include '**/*.groovy' }
            from(libBuildClassesDir.asFile) { include '**/*.class' }
            into new File(pluginOut, 'classes')
        }
    }
}

// ── dist target ───────────────────────────────────────────────────────────────
tasks.register('dist', Zip) {
    group       = 'build'
    description = 'Create distribution ZIP (equivalent to Ant dist)'
    dependsOn 'buildPlugin'
    archiveFileName = "${pluginName}-v${version}.zip"
    destinationDirectory.set(layout.projectDirectory.dir('releases'))
    from layout.buildDirectory.dir('plugin')
}

// ── run-tests target ──────────────────────────────────────────────────────────
tasks.named('test') {
    useJUnit()
    classpath += configurations.testConf
    classpath += files(libTestJavaDir)
    reports {
        junitXml.outputLocation.set(layout.projectDirectory.dir('releases/report'))
        html.outputLocation.set(layout.projectDirectory.dir('releases/report/html'))
    }
}

tasks.register('runTests') {
    group       = 'verification'
    description = 'Compile and run JUnit tests (equivalent to Ant run-tests)'
    dependsOn 'compileTests', 'test'
}

// ── main target (default) ─────────────────────────────────────────────────────
tasks.register('main') {
    group       = 'build'
    description = 'Full build: clean → resolve → compile → buildPlugin → dist'
    dependsOn 'cleanBuild', 'resolve', 'compileClasses', 'buildPlugin', 'dist'
    doLast {
        println 'Plugin build complete!'
    }
}

tasks.named('resolve')       { mustRunAfter 'cleanBuild' }
tasks.named('compileClasses'){ mustRunAfter 'resolve'    }
tasks.named('buildPlugin')   { mustRunAfter 'compileClasses' }
tasks.named('dist')          { mustRunAfter 'buildPlugin' }

defaultTasks 'main'
